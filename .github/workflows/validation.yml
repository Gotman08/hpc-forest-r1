name: Forest validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
            lock: requirements-linux-py312.lock
          - os: windows-latest
            python: '3.13'
            lock: requirements-windows-py313.lock
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin'
      - run: python -m pip install -r ${{ matrix.lock }}
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check src tests tools
      - run: python -m pytest --junitxml=artifacts/pytest.xml
      - run: node --test tests/test_web_frontend.mjs
      - run: python tools/build_release.py artifacts/release
