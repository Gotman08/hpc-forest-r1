# Backend CLI local. Exporter d'abord l'environnement d'un dsh-romeo déjà actif :
# eval "$(dsh-romeo --env)"
# Pour l'application autonome ROMEO, voir docs/APPLICATION.md (romeo.json).
backend = "codex"

[codex]
executable = "codex"
model = "dsh-deepseek-v4.1-flash-1017-1m"
reasoning_effort = "max" # none, low, high, max
