# Serveur Ollama local, modèle déjà téléchargé : ollama pull qwen2.5-coder:7b
# Sur ROMEO, démarrer Ollama uniquement dans une allocation Slurm GPU.
backend = "ollama"
method = "H"
seed = 23
roles = ["A", "B", "C"]

[budget]
search_slots = 6
confirmation_slots = 3
wall_seconds = 900
confirmation_seconds = 120
generation_seconds = 120
tokens = 100000
mission_tokens = 20000
max_workers = 1
infrastructure_retries = 0

[schedule]
cycles = 1
trials_per_role_per_cycle = 1
integrations_per_cycle = 2

[ollama]
base_url = "http://127.0.0.1:11434"
model = "qwen2.5-coder:7b"
temperature = 0.0
context_tokens = 16384
max_output_tokens = 3072
num_threads = 4
