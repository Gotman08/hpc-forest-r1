[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-forest-r1"
version = "0.1.0"
description = "Isolated and refactored R1 engine for reproducible HPC experiments"
requires-python = ">=3.11"
dependencies = ["treequest==0.3.2"]

[project.optional-dependencies]
advisor = ["tabpfn==9.2.0"]
sakana-m = ["treequest[abmcts-m]==0.3.2"]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1.2"]
mcp = ["mcp>=1.12,<2", "pypdf[fonts]>=6,<7"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "mcp>=1.12,<2", "pypdf[fonts]>=6,<7"]

[project.scripts]
hpc-forest-r1 = "hpc_forest.cli:main"
hpc-forest-app = "hpc_forest.webapp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpc_forest = ["assets/**/*"]
"hpc_forest.webapp" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
