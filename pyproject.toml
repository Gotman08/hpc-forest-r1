[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-forest-r1"
version = "0.1.0"
description = "Isolated and refactored R1 engine for reproducible HPC experiments"
requires-python = ">=3.11"
dependencies = ["treequest==0.3.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1.2"]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
hpc-forest-r1 = "hpc_forest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpc_forest = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
